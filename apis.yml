name: WeStock
description: WeStock is a shopper-marketing platform that helps consumer packaged goods (CPG)
  brands drive product trial, build first-party retail audiences, and manage trade and shopper
  marketing strategy from a single dashboard. It combines digital rebates and promotional
  campaigns, paid social advertising (primarily Meta), in-store sampling and demos, retail
  media management across Amazon, Walmart, and Instacart, email/SMS automation, and influencer
  marketing, alongside a consumer discovery web app used by 600,000+ shoppers to browse new
  products. Campaign data — trials, conversions, and repeat behavior — is unified in one place.
  A Techstars-backed company; its public surface is a marketing site and login-gated dashboard,
  with a private backend API (api.westock.io) that is not publicly documented.
