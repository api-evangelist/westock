name: WeStock
description: >-
  WeStock is a shopper-marketing platform that helps consumer packaged goods (CPG)
  brands drive product trial, build first-party retail audiences, and manage trade and shopper
  marketing strategy from a single dashboard. It combines digital rebates and promotional
  campaigns, paid social advertising (primarily Meta), in-store sampling and demos, retail
  media management across Amazon, Walmart, and Instacart, email/SMS automation, and influencer
  marketing, alongside a consumer discovery web app used by 600,000+ shoppers to browse new
  products. Campaign data — trials, conversions, and repeat behavior — is unified in one place.
  A Techstars-backed company; its entire public surface is a Webflow marketing site, a Help Scout
  knowledge base of product how-tos, and login-gated dashboard and consumer apps. WeStock runs a
  real first-party backend at api.westock.io — hardened Node/Express that answers HTTP 401 on
  every path including the root — but ships no developer program: no API reference, no OpenAPI or
  GraphQL schema, no SDK on any registry, no webhooks, and no API pricing. Its documented
  integrations run the other way: WeStock consumes Klaviyo and Attentive using keys the customer
  pastes into the WeStock dashboard.
