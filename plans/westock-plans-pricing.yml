plan_count: 3
pricing_model: contact-sales
currency: USD
description: >-
  WeStock publishes three named platform tiers on its pricing page — Essential,
  Growth and Scale — but publishes NO price for any of them: every tier's call to
  action is "Contact Us / Book a demo". What the page does publish is the
  entitlement ladder (storefront credits, rebate scope, consumer contact
  downloads) and the contract term attached to each tier, plus two real overage
  rates for additional storefront credits. These are platform/SaaS plans for CPG
  brands, not API plans — WeStock does not publish an API, so there is no
  developer tier, no request quota, and no metered API pricing anywhere on this
  page. Values below are transcribed verbatim from the published pricing page on
  2026-08-12; nothing is inferred.
notes:
  - Every tier is quote-only. No list price, no per-seat price, and no free tier
    or self-serve signup is published; the only self-serve entry point on the site
    is the consumer-side app (app.westock.io), not the brand platform.
  - The "storefront credit" is the unit of account across the Growth and Scale
    tiers and is the only metered/overage dimension WeStock publishes.
  - Contract term is a published, differentiating attribute of each tier
    (month-to-month / 90-day minimum / 12-month) and is captured here as a plan
    limit because it is the commitment a buyer is quoted against.
