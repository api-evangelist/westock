description: >-
  Results of probing the /.well-known/ discovery surface across every WeStock host
  found in apis.yml and via Certificate Transparency (api.certspotter.com,
  domain=westock.io, include_subdomains=true). NOTHING WAS FOUND. Not one host
  serves a real document at any /.well-known/ path, so no WellKnown, SecurityTxt,
  APICatalog or AgentCard pointer is wired into apis.yml — this file records a
  measured ABSENCE, not a presence.
  Three distinct failure shapes are represented below and they are not
  interchangeable:
    - westock.io / www.westock.io (Webflow) answers 404 with an
      "Invalid .well-known request" HTML page for every path.
    - api.westock.io answers 401 "Unauthorized" (text/plain, 12 bytes) for EVERY
      path including the site root — the entire host is credential-gated, so the
      probe cannot distinguish "no document" from "document behind auth".
    - dashboard.westock.io, dashboard2.westock.io, labs.westock.io and
      engage.westock.io are single-page apps whose catch-all returns HTTP 200 with
      a text/html shell for every path, INCLUDING /.well-known/agent-card.json and
      /.well-known/agent.json. These 200s are SPA shells, not documents, and are
      explicitly recorded as misses. This is the dominant false-positive shape for
      agent-card discovery and it is rejected here per the pipeline contract.
